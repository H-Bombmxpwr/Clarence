# Lavalink v4 config for Clarence's music player.
# No cookies, OAuth or poToken are used — YouTube is accessed anonymously, and the bot
# falls back to SoundCloud automatically if YouTube refuses a track.
server:
  port: ${PORT:2333}
  address: ${SERVER_ADDRESS:0.0.0.0}   # set SERVER_ADDRESS=:: on Railway for private networking
  http2:
    enabled: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Clients tried in order. MUSIC is search-only; the others play audio without logging in.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
      - TVHTML5_SIMPLY

  lavasrc:
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      # Spotify links are resolved to metadata and played from YouTube/SoundCloud.
      # Needs a free Spotify *developer app* (client id/secret) — not a Spotify login.
      spotify: ${SPOTIFY_ENABLED:false}
      applemusic: true
      deezer: false
      yandexmusic: false
    spotify:
      clientId: ${SPOTIFY_CLIENT_ID:}
      clientSecret: ${SPOTIFY_CLIENT_SECRET:}
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
    applemusic:
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  server:
    password: "${LAVALINK_SERVER_PASSWORD:youshallnotpass}"
    sources:
      youtube: false        # replaced by the youtube plugin above
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 1000      # larger buffer rides out CPU/GC hiccups instead of skipping
    frameBufferDurationMs: 5000
    opusEncodingQuality: 5       # 10 is much more CPU for no audible gain over Discord
    resamplingQuality: LOW      # inaudible through Discord, much cheaper on a small instance
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

metrics:
  prometheus:
    enabled: false

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
